[project]
name = "subtask-annotator"
version = "0.1.0"
description = "Web-based subtask annotation tool for lerobot v2.1 datasets"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyarrow>=15",
  "pandas>=2.0",
  "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]
